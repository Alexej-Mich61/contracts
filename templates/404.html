<!-- templates/404.html -->
{% extends "base.html" %}
{% load static %}

{% block title %}Страница не найдена — 404{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <h1 class="display-1 text-primary fw-bold">404</h1>
            <h2 class="mb-4">Страница не найдена</h2>
            <p class="lead text-muted mb-5">
                Запрошенная страница не существует. Возможно, ссылка устарела или адрес введён с ошибкой.
            </p>
            <a href="{% url 'contracts:contract_list' %}" class="btn btn-primary btn-lg px-5">
                <i class="fas fa-home me-2"></i>На главную
            </a>
        </div>
    </div>
</div>
{% endblock %}
