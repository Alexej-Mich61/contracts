<!-- templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Долгосрочные договоры{% endblock %}</title>

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
    <link href="{% static 'css/dark-theme.css' %}" rel="stylesheet" id="dark-theme-link">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold" href="{% url 'contracts:contract_list' %}">
                Техническое обслуживание
            </a>
            <div class="d-flex align-items-center gap-4">
                <span class="navbar-text text-light small">
                    {% now "j E Y г., H:i" %}
                </span>
                <div class="d-flex align-items-center">
                    <span class="me-2 text-light small">Тема:</span>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                        <label class="form-check-label text-light" for="darkModeSwitch">Moon</label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <!-- Toast контейнер — ОБЯЗАТЕЛЬНО id="toastContainer" (без дефиса!) -->
    <div aria-live="polite" aria-atomic="true" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
        <div id="toastContainer"></div>
    </div>

    <!-- Bootstrap + наш main.js -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

    <!-- Передаём Django messages в JS как валидный JSON -->
    {% if messages %}
    <script id="django-messages-data" type="application/json">
    [
        {% for message in messages %}
        {"message": "{{ message|escapejs }}", "tags": "{{ message.tags }}"} {% if not forloop.last %},{% endif %}
        {% endfor %}
    ]
    </script>
    {% endif %}

    {% block extra_js %}{% endblock %}
</body>
</html>
