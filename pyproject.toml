# pyproject.toml
[tool.black]
line-length = 100
target-version = ["py39"]
exclude = '''
/(
    \\.eggs         |
    \\.git          |
    \\.hg           |
    \\.mypy_cache   |
    \\.tox          |
    \\.venv         |
    venv            |
    _build          |
    buck-out        |
    build           |
    dist            |
    migrations      |
    templates       |
    htmlcov         |
    \\.pytest_cache
)/
'''

[tool.isort]
profile = "black"                    # ← автоматически подстраивается под Black
line_length = 100
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
skip = ["migrations", "venv", "__init__.py"]  # не трогаем миграции
known_first_party = ["contracts", "contracts_app"]